name: Live agent (opt-in)

on:
  workflow_dispatch:
    inputs:
      claude_version:
        description: Exact approved Claude CLI version expected on the isolated runner
        required: true
        type: string

jobs:
  live-agent:
    runs-on: [self-hosted, projectflow-live-agent]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-provisioned Claude CLI pin
        env:
          EXPECTED_CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          set -euo pipefail
          actual="$(claude --version)"
          printf '%s\n' "$actual"
          case "$actual" in
            *"$EXPECTED_CLAUDE_VERSION"*) ;;
            *) echo "Claude CLI version mismatch: expected $EXPECTED_CLAUDE_VERSION" >&2; exit 1 ;;
          esac
      - run: python -m pip install -e '.[test]'
      - run: ./scripts/preflight.sh
      - name: Run credentialed live-agent contract tests
        env:
          PROJECTFLOW_INCLUDE_LIVE_AGENT: "1"
        run: ./scripts/test.sh

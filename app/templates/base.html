<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ProjectFlow Workspace Manager</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/guide.css"><link rel="stylesheet" href="/static/launcher.css"></head><body>
<aside><h1>ProjectFlow<br><small>Workspace Manager</small></h1><nav><a href="/">Dashboard</a><a href="/workspaces">Agent Workspaces</a><a href="/integrations">Integrations</a><a href="/repositories">Repositories</a><a href="/test-runs">Test Runs</a><a href="/help">Hướng dẫn</a><a href="/settings">Settings</a></nav><footer>Local only · v0.1.0</footer></aside>
<main><header><div><span class="eyebrow">ONE AGENT · ONE BRANCH · ONE WORKTREE</span><h2>{% block title %}{% endblock %}</h2></div>{% block header_action %}{% endblock %}</header>{% block content %}{% endblock %}</main>
<script>async function launchWorkspace(id,kind,button){let original=button.textContent;button.disabled=true;button.textContent=kind==='agent'?'Launching agent...':'Opening terminal...';let feedback=document.querySelector(`[data-launch-feedback="${id}"]`);try{let response=await fetch(`/api/workspaces/${id}/${kind==='agent'?'launch-agent':'open-terminal'}`,{method:'POST'}),data=await response.json();if(!response.ok)throw data;if(feedback){feedback.textContent=data.message+(data.fallback?` · Fallback: ${data.fallback}`:'');feedback.className='launch-feedback error'}else alert(data.message);button.textContent=data.ok?'Launch requested':original}catch(error){let message=error.message||'Không mở được terminal';if(feedback){feedback.textContent=message+(error.fallback?` · Fallback: ${error.fallback}`:'');feedback.className='launch-feedback error'}else alert(message);button.textContent=original}finally{setTimeout(()=>{button.disabled=false;button.textContent=original},1800)}}setTimeout(()=>{if(document.querySelector('[data-running]'))location.reload()},3000)</script></body></html>

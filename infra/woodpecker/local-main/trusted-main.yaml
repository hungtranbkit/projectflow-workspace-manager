# ONLY verified protected main, invoked by trusted-main SHA poller.
# Unsandboxed Local backend. PASS means FAST gates only; FULL CI NOT RUN.
when:
  - event: push
    branch: main

steps:
  - name: fast-quality-gates
    image: bash
    commands:
      - ./scripts/preflight.sh
      - ./scripts/build.sh
      - ./scripts/smoke.sh
      - ./scripts/ci-test.sh fast

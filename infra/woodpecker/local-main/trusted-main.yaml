# ONLY trusted/protected main, invoked by a host-local Git SHA poller.
# Never use this pipeline for fork PRs: backend=local has NO isolation.
when:
  - event: push
    branch: main

steps:
  - name: quality-gates
    image: bash
    commands:
      - ./scripts/preflight.sh
      - ./scripts/build.sh
      - ./scripts/test.sh
      - ./scripts/smoke.sh

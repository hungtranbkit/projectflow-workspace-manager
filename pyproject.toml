[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-manager"
version = "0.1.0"
description = "Local-only agent worktree and integration readiness manager"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "PyYAML>=6,<7", "websockets>=12,<16", "ruamel.yaml>=0.18,<1",
    # B0.1 (docs/B0_HOSTED_PLATFORM_SECURITY_FOUNDATION.md): itsdangerous
    # is required by starlette.middleware.sessions.SessionMiddleware --
    # NOT actually installed transitively via fastapi/starlette in this
    # environment (verified directly: `import itsdangerous` failed
    # before this dependency was added), correcting an earlier ADR
    # research claim that it "ships transitively" -- declared explicitly
    # rather than relied upon implicitly. slowapi is ADR-003's own
    # resolved choice for rate limiting (a maintained, pluggable-backend
    # library, in-memory backend at B0.1 launch).
    "itsdangerous>=2.1,<3", "slowapi>=0.1.9,<1",
    # B0.7 (docs/B0_HOSTED_PLATFORM_SECURITY_FOUNDATION.md): the general
    # encrypted org-scoped secret store needs real, authenticated
    # encryption-at-rest -- Python's stdlib has no AES/AEAD primitive at
    # all, and hand-rolling one is exactly the "never a hand-rolled ...
    # raw access token handled by this app" class of mistake this
    # codebase's own GitHub-integration docstring already refuses to
    # make elsewhere. `cryptography` (pyca) is the de facto standard,
    # audited Python crypto library -- the same justified, narrow
    # dependency-minimalism exception ADR-003 already set precedent for
    # (slowapi/itsdangerous), not a general policy reversal.
    # B2.3 (docs/B2_RELEASE_CONCURRENCY_AND_RESIDUAL_SECURITY.md):
    # pip-audit found 4 real advisories against 46.0.7 (PYSEC-2026-3552/
    # 3553/3554, GHSA-537c-gmf6-5ccf) -- none in APIs this app actually
    # calls (Fernet/MultiFernet only; the advisories are PKCS7 decrypt
    # and x509 chain/name-constraint verification, both unused here),
    # but a real fix exists with no code change needed, so the pin
    # moved forward rather than left resting on "not reachable today."
    "cryptography>=42,<51"]

[project.optional-dependencies]
# B4 (docs/B4_GITHUB_WEBHOOK_STATUS_INGESTION.md): B2/B3's own pip-audit
# both flagged PYSEC-2026-1845 against pytest 8.4.2 (fixed 9.0.3) but
# deferred bumping it as "a real compatibility decision, not made
# unilaterally" -- re-examined here with real evidence instead of
# assumption: pytest>=9,<10 installed, the full fast non-real suite
# (1080+ tests) collected and ran clean, zero failures, before this pin
# moved. Same "verify, then adopt" pattern as B2's cryptography bump.
test = ["pytest>=9,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

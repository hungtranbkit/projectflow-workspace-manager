[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-manager"
version = "0.1.0"
description = "Local-only agent worktree and integration readiness manager"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1", "PyYAML>=6,<7", "websockets>=12,<16", "ruamel.yaml>=0.18,<1",
    # B0.1 (docs/B0_HOSTED_PLATFORM_SECURITY_FOUNDATION.md): itsdangerous
    # is required by starlette.middleware.sessions.SessionMiddleware --
    # NOT actually installed transitively via fastapi/starlette in this
    # environment (verified directly: `import itsdangerous` failed
    # before this dependency was added), correcting an earlier ADR
    # research claim that it "ships transitively" -- declared explicitly
    # rather than relied upon implicitly. slowapi is ADR-003's own
    # resolved choice for rate limiting (a maintained, pluggable-backend
    # library, in-memory backend at B0.1 launch).
    "itsdangerous>=2.1,<3", "slowapi>=0.1.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
